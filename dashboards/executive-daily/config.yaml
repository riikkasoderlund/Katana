# Executive Dashboard Configuration
# Last updated: 2026-02-02

schedule:
  cron: "0 7 * * *"  # 7 AM daily
  timezone: "Europe/Helsinki"

notifications:
  slack:
    channel: "@riikka"
    enabled: true

# Data source connections (via connectors)
data_sources:
  hubspot:
    connector: "hubspot"
    pipeline_stages:
      - "Qualification"
      - "Solution Validation"
      - "Order form sent"
      - "Closed Won"
      - "Closed Lost"

  databricks:
    connector: "databricks_genie"
    tables:
      mrr: "finance.mrr_daily"
      churn: "finance.churn_events"
      customers: "finance.customers"

