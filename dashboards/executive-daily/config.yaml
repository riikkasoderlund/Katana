# Performance thresholds for RAG status
thresholds:
  pipeline:
    # Days to flag stale deals
    stale_days: 14
    # % of target pipeline coverage needed
    coverage_green: 1.2  # 120%+ = green
    coverage_yellow: 0.8  # 80-120% = yellow, <80% = red

  revenue:
    # % of MTD target achievement
    mtd_green: 0.95  # 95%+ of pace = green
    mtd_yellow: 0.80  # 80-95% = yellow, <80% = red

  churn:
    # MRR churn threshold for alerts
    daily_churn_alert: 5000  # Alert if single day churn > $5k
    gross_churn_green: 0.025  # <2.5% monthly = green
    gross_churn_yellow: 0.030  # 2.5-3% = yellow, >3% = red
